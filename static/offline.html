<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#19201d">
		<title>Offline · List</title>
		<style>
			:root { color-scheme: light dark; font: 1rem/1.6 system-ui, sans-serif; }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
			main { box-sizing: border-box; max-width: 38rem; padding: 2rem; }
			h1 { line-height: 1.2; }
			button { cursor: pointer; padding: .5rem 1rem; font: inherit; }
			.done { text-decoration: line-through; }
		</style>
	</head>
	<body>
		<main>
			<h1>You’re offline</h1>
			<p id="offline-message">Reconnect to open your lists.</p>
			<section id="offline-content" aria-live="polite"></section>
			<button id="offline-retry" type="button">Try again</button>
		</main>
		<script src="/offline.js" defer></script>
	</body>
</html>
