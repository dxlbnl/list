stages:
    - build:svelte
    - build:image
    - deploy

# before_script:

build:svelte:
  stage: build:svelte
  image: node:14.16.0-buster
  before_script:
    - curl -f https://get.pnpm.io/v6.16.js | node - add --global pnpm@7
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install # install dependencies
    - pnpm build
  artifacts:
    paths:
    - build
    expire_in: 1 week
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    
build:main:
  stage: build:image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --destination $CI_REGISTRY_IMAGE:latest
  dependencies:
    - build:svelte
  only:
    - main


deploy:production:
  stage: deploy
  script:
    - docker login -u $CI_DEPLOY_USER -p $CI_DEPLOY_PASSWORD $CI_REGISTRY
    # - cp .env.default .env
    - docker-compose -p list pull
    - docker-compose -p list up -d
  tags:
    # Deploy on kabelfabriek vps
    - dxhost-deploy
  environment:
    name: production
    url: https://list.dxlb.nl
  only:
    - master
